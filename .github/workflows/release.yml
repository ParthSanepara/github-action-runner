name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (semver, e.g. 1.0.0 or 1.0.0-rc1)'
        required: true
        type: string
      push_dockerhub:
        description: 'Push to Docker Hub'
        required: true
        default: true
        type: boolean
      push_ghcr:
        description: 'Push to GitHub Container Registry (ghcr.io)'
        required: true
        default: true
        type: boolean
      mark_latest:
        description: 'Also tag as :latest'
        required: true
        default: true
        type: boolean
      platforms:
        description: 'Target platforms'
        required: true
        default: 'linux/amd64,linux/arm64'
        type: string

env:
  IMAGE_NAME: github-action-runner

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # required to push to ghcr.io
    steps:
      - name: Validate version
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::error::Version '${{ inputs.version }}' is not valid semver"
            exit 1
          fi
          if [[ "${{ inputs.push_dockerhub }}" != "true" && "${{ inputs.push_ghcr }}" != "true" ]]; then
            echo "::error::At least one registry must be selected"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Read runner version from Dockerfile
        id: dockerfile
        run: |
          echo "runner_version=$(awk -F'=' '/^ARG RUNNER_VERSION=/{print $2}' Dockerfile)" >> "$GITHUB_OUTPUT"

      - name: Compute tags
        id: tags
        run: |
          tags=""
          if [[ "${{ inputs.push_dockerhub }}" == "true" ]]; then
            tags+="${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:${{ inputs.version }}\n"
            [[ "${{ inputs.mark_latest }}" == "true" ]] && tags+="${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:latest\n"
          fi
          if [[ "${{ inputs.push_ghcr }}" == "true" ]]; then
            tags+="ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}:${{ inputs.version }}\n"
            [[ "${{ inputs.mark_latest }}" == "true" ]] && tags+="ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}:latest\n"
          fi
          {
            echo "list<<EOF"
            echo -e "${tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: inputs.push_dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        if: inputs.push_ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.tags.outputs.list }}
          build-args: |
            RUNNER_VERSION=${{ steps.dockerfile.outputs.runner_version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.description=Self-hosted GitHub Actions runner (Ubuntu 24.04)
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Released \`${{ inputs.version }}\`"
            echo ""
            echo "**Runner**: ${{ steps.dockerfile.outputs.runner_version }}"
            echo "**Platforms**: ${{ inputs.platforms }}"
            echo ""
            echo "**Tags pushed:**"
            echo '```'
            echo -e "${{ steps.tags.outputs.list }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
